packages:
  - cli
  - packages/*
  - plugins/*

allowBuilds:
  esbuild: false
  unrs-resolver: false
  yarn: false

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'semver@5.7.2 || 6.3.1'
  - 'undici-types@6.21.0'

catalog:
  '@oclif/core': ^4.10.6
  '@powersync/management-client': ^0.1.1
  '@powersync/management-types': ^0.2.0
  '@powersync/service-client': ^0.0.6
  '@powersync/service-schema': ^1.21.0
  '@powersync/service-sync-rules': ^0.36.0
  '@powersync/service-types': ^0.15.2
  oclif: 4.23.0

patchedDependencies:
  oclif: patches/oclif.patch
